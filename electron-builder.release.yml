# Explicit public-distribution configuration. Local dist:mac stays unsigned.
appId: com.faangin.desktop
productName: Faangin
directories:
  output: dist/release-mac
  buildResources: resources
files:
  - out/**
  - package.json
  - '!node_modules/**/test/**'
  - '!node_modules/**/tests/**'
asar: true
npmRebuild: false
forceCodeSigning: true
mac:
  icon: resources/icon.icns
  category: public.app-category.productivity
  type: distribution
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  artifactName: Faangin-${version}-macOS-${arch}.${ext}
  # Identity is resolved from CSC_NAME by electron-builder; null would skip signing.
  hardenedRuntime: true
  strictVerify: true
  notarize: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Faangin uses your microphone when you start listening. Setup checks permission before you begin.
    NSScreenCaptureUsageDescription: Faangin captures your screen when you choose Capture. Setup checks access without saving screen images.
    NSAudioCaptureUsageDescription: Faangin checks computer audio access during setup and on launch after your approval. Audio is transcribed only when you start listening.
    NSHighResolutionCapable: true
    LSMinimumSystemVersion: '14.4'
dmg:
  sign: true
  # Stapling changes the DMG; no stale updater blockmap should be emitted.
  writeUpdateInfo: false
publish: null
