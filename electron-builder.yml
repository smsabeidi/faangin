appId: com.faangin.desktop
productName: Faangin
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  # electron-vite treats resources/ as the main-process public directory, so the tray icon's ?asset import resolves to this
  # path at runtime instead of a copy under out/; buildResources is otherwise excluded from the asar.
  - resources/icon.png
  - package.json
  - '!node_modules/**/test/**'
  - '!node_modules/**/tests/**'
asar: true
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # The local arm64 bundle still needs an ad-hoc signature after its framework is patched.
  resetAdHocDarwinSignature: true
npmRebuild: false
mac:
  icon: resources/icon.icns
  category: public.app-category.productivity
  protocols:
    - name: com.faangin.desktop.auth
      role: Viewer
      schemes: [faangin]
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  identity: null
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: Faangin uses your microphone when you start listening. Setup checks permission before you begin.
    NSScreenCaptureUsageDescription: Faangin captures your screen when you choose Capture. Setup checks access without saving screen images.
    NSAudioCaptureUsageDescription: Faangin checks computer audio access during setup and on launch after your approval. Audio is transcribed only when you start listening.
    NSHighResolutionCapable: true
    LSMinimumSystemVersion: '14.4'
win:
  # Committed ICO (scripts/icons.mjs) so builds need no icon conversion toolset download.
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Faangin-${version}-Windows-${arch}-setup.${ext}
  # Per-user install under %LOCALAPPDATA%; the app never needs elevation.
  requestedExecutionLevel: asInvoker
  # Unsigned locally: no CSC_LINK means electron-builder skips signing. When it signs, this is the publisher it records for
  # signature verification (defaulting to the certificate's common name); installer metadata (CompanyName) comes from package.json author.
  signtoolOptions:
    publisherName: Muhammed Salim
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Faangin
  # Reinstalls keep the offline licence, account store and safeStorage-encrypted keys.
  deleteAppDataOnUninstall: false
  runAfterFinish: true
publish: null
