<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment received</title>
<style>
  :root { --bg: #f6f6f7; --card: #ffffff; --text: #1a1a1a; --muted: #666666; --line: #dddddd; --accent: #2457d6 }
  @media (prefers-color-scheme: dark) { :root { --bg: #131416; --card: #1d1f23; --text: #ececec; --muted: #9a9a9a; --line: #33363c; --accent: #5b8cff } }
  body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text) }
  main { max-width: 460px; margin: 48px auto; padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 12px }
  h1 { font-size: 22px; margin: 0 0 8px }
  p { margin: 0 0 12px }
  .muted { color: var(--muted); font-size: 14px }
  a { color: var(--accent) }
</style>
</head>
<body>
<main>
  <h1>Thanks for your purchase.</h1>
  <p>We are confirming your payment. Faangin on your Mac picks up your plan on its own within a minute or two; if it does not, choose "Refresh license" in the app. Bank payments can take a few days to confirm.</p>
  <p class="muted">A receipt is on its way from Stripe.</p>
  <p><a href="/activate">Back to your account</a></p>
</main>
</body>
</html>
